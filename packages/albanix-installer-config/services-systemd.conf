# services-systemd.conf — Calamares systemd services module
# Runs on the LIVE ISO.
# Enables core services on the target system.

services-systemd:
  services:
    - NetworkManager
    - bluetooth
    - cups
    - sddm
    - fstrim.timer
    - systemd-oomd
    - power-profiles-daemon
    - ananicy-cpp
    - thermald
    - reflector.timer
    - snapper-timeline.timer
    - snapper-cleanup.timer
    - snapper-boot.timer
