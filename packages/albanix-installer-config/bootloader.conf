# bootloader.conf — Calamares bootloader module
# Runs on the LIVE ISO.
# systemd-boot for UEFI, GRUB for BIOS. Albanix theme applied.

bootloader:
  # The actual installer selection (UEFI vs BIOS) is made by Calamares core.
  # Theme entries (Red/Blue) are installed by albanix-installer-config.
  gfxmenu: true
  theme: "albanix-red"
