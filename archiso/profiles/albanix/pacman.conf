# pacman.conf — Albanix OS (used by archiso for the live root AND copied to
# the installed target system by customize_airootfs.sh)
# Runs on the HOST during ISO build; the resulting file lives in the ISO.

[options]
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
# Force architecture check: x86_64 only.
Architecture = auto

# Download 10 packages in parallel (faster ISO builds and updates).
ParallelDownloads = 10

# Visual goodies.
Color
ILoveCandy
VerbosePkgLists

# Use system downtime to clean the package cache automatically.
CleanMethod = KeepInstalled
# Keep only the last 3 versions of each installed package in the cache.
# (hand-tuned; adjust with `pacman -Sc`)

# Mandatory access control: run package upgrades with AppArmor confinement
# where profiles exist (no-op if AppArmor is not enforced).
# No sandbox hook by default — keep it simple and auditable.

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# =====================================================================
# REPOSITORIES
# =====================================================================

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
# Multilib enabled for Steam, Wine, gaming and 32-bit compatibility.
Include = /etc/pacman.d/mirrorlist

# ---------------------------------------------------------------------
# [albanix] — Albanix own repository (self-built packages)
# Fast path: packages pre-built by the Albanix project and published on
# GitHub Releases. Self-built path: build packages locally with build.sh
# and point this Include at a local mirror.
# GPG key: distributed via albanix-keyring (see packages/albanix-keyring).
# ---------------------------------------------------------------------
# [albanix]
# SigLevel = Required
# Include = /etc/pacman.d/albanix-mirrorlist

# ---------------------------------------------------------------------
# [cachyos] / [cachyos-v3] / [cachyos-v4] — CachyOS optimized repositories
# FAST PATH (opt-in, requires trusting CachyOS key F3B607488DB35A47).
# The install-time script albanix-repo-select detects the CPU tier
# (x86-64-v1 / v3 / v4 via ld.so --help) and uncomments the matching
# block below. Generic x86-64 is the safe fallback when detection fails
# or the user declines the optimized repos.
#
# Manual enable example (HOST or CHROOT, as root):
#   echo -e "[cachyos-v3]\nSigLevel = Required\nInclude = /etc/pacman.d/cachyos-v3-mirrorlist" >> /etc/pacman.conf
# ---------------------------------------------------------------------
# [cachyos-v3]
# SigLevel = Required
# Include = /etc/pacman.d/cachyos-v3-mirrorlist

# [cachyos-v4]
# SigLevel = Required
# Include = /etc/pacman.d/cachyos-v4-mirrorlist

# [cachyos-x86-64]
# SigLevel = Required
# Include = /etc/pacman.d/cachyos-x86-64-mirrorlist
