# users.conf — Calamares users module
# Runs on the LIVE ISO.
# Sane sudo: wheel group, password required on installed system
# (live ISO uses NOPASSWD via customize_airootfs.sh).

users:
  autoLogin: false
  # The real user is created in the Calamares UI; here we set defaults.
  groups:
    - wheel
    - video
    - audio
    - optical
    - storage
    - input
    - network
