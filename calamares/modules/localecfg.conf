# localecfg.conf — Calamares locale configuration module
# Runs on the LIVE ISO.
# Writes /etc/locale.conf and /etc/locale.gen on the target according to
# the chosen language (sq_AL.UTF-8 default, en_US.UTF-8 alternative).

localecfg:
  # The locale module sets these; here we ensure target files are written.
  enabled: true
