# partition.conf — Calamares partition module
# Runs on the LIVE ISO.
# Albanix default: Btrfs with subvolumes @, @home, @log, @cache, @snapshots,
# zstd:1, noatime, space_cache=v2, discard=async on SSD.
# Options: LUKS2 full-disk encryption, swapfile or zram, ext4/XFS alternatives.

partition:
  # Default layout when no disk is preselected.
  default:
    mountPoint: "/"
    fileSystem: "btrfs"
    # Mount options passed to fstab via the fstab module.
    mountOptions: "noatime,compress=zstd:1,space_cache=v2,discard=async"
    subvolumes:
      - name: "@"
        mountPoint: "/"
      - name: "@home"
        mountPoint: "/home"
      - name: "@log"
        mountPoint: "/var/log"
      - name: "@cache"
        mountPoint: "/var/cache"
      - name: "@snapshots"
        mountPoint: "/.snapshots"
  # swapfile preferred on Btrfs; zram handled by zram-generator (always on).
  swap:
    type: "swapfile"
    size: "4G"
