# Albanix OS locale defaults.
# Albanian conventions: dd.MM.yyyy dates, 24-hour clock, comma decimal
# separator, space thousands delimiter, currency ALL (Lek), week starts
# Monday, A4 paper.
LANG=sq_AL.UTF-8
LC_COLLATE=C
LC_CTYPE=sq_AL.UTF-8
LC_NUMERIC=sq_AL.UTF-8
LC_TIME=sq_AL.UTF-8
LC_MONETARY=sq_AL.UTF-8
LC_PAPER=sq_AL.UTF-8
LC_MEASUREMENT=sq_AL.UTF-8
LC_ADDRESS=sq_AL.UTF-8
LC_TELEPHONE=sq_AL.UTF-8
LC_NAME=sq_AL.UTF-8
LC_MESSAGES=sq_AL.UTF-8