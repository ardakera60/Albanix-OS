# grubcfg.conf — Calamares GRUB configuration module (BIOS)
# Runs on the LIVE ISO.
# Generates grub.cfg on the target with theme entries.

grubcfg:
  theme: "albanix-red"   # set dynamically by theme-choice module
  os_prober: true        # detect other OSes (dual-boot)
  timeout: 5
  grub_install_devices: "auto"
