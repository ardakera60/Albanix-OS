# albanix-theme-choice.conf — Custom Calamares module: theme selection
# Runs on the LIVE ISO.
# Presents "Zgjidh temën / Choose your theme" with live preview images,
# stores choice to /var/lib/calamares/albanix-theme for shellprocess to apply.

albanix-theme-choice:
  # Preview images (installed by albanix-installer-config).
  preview_red:  "/usr/share/calamares/branding/albanix/theme-preview-red.svg"
  preview_blue: "/usr/share/calamares/branding/albanix/theme-preview-blue.svg"
  # Storage file consumed by albanix-postinstall.sh.
  storage_file: "/var/lib/calamares/albanix-theme"
  default_theme: "red"
  enabled: true
