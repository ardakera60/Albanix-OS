# syslinux BIOS boot menu — Albanix OS
UI menu.c32
MENU TITLE Albanix OS Boot Menu
MENU BACKGROUND /boot/albanix/splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #00000000 std
MENU COLOR sel          7;37;40 #e41e20 #00000000 all
MENU COLOR unsel        37;44   #ffffffff #00000000 std
MENU COLOR help         37;44   #ffffffff #00000000 std
MENU COLOR timeout_msg  37;44   #ffffffff #00000000 std
MENU COLOR timeout      1;37;44 #c0ffffff #00000000 std
MENU COLOR hotsel       1;37;40 #ffff0000 #00000000 all
TIMEOUT 50
TOTALTIMEOUT 5000
ONTIMEOUT albanix-red

LABEL albanix-red
    MENU LABEL Albanix OS (Red) — KDE Plasma 6
    LINUX /boot/vmlinuz-albanix
    INITRD /boot/initramfs-albanix.img
    APPEND archisobasedir=albanix archisodevice=/dev/disk/by-label/ALBANIX_OS albanix.theme=red albanix.lang=sq quiet splash

LABEL albanix-blue
    MENU LABEL Albanix OS (Blue) — KDE Plasma 6
    LINUX /boot/vmlinuz-albanix
    INITRD /boot/initramfs-albanix.img
    APPEND archisobasedir=albanix archisodevice=/dev/disk/by-label/ALBANIX_OS albanix.theme=blue albanix.lang=sq quiet splash

LABEL albanix-safe
    MENU LABEL Albanix OS (safe graphics) — English
    LINUX /boot/vmlinuz-albanix
    INITRD /boot/initramfs-albanix.img
    APPEND archisobasedir=albanix archisodevice=/dev/disk/by-label/ALBANIX_OS albanix.theme=red albanix.lang=en nomodeset quiet splash

LABEL albanix-lts
    MENU LABEL Albanix OS (Red) — Linux LTS kernel
    LINUX /boot/vmlinuz-linux-lts
    INITRD /boot/initramfs-linux-lts.img
    APPEND archisobasedir=albanix archisodevice=/dev/disk/by-label/ALBANIX_OS albanix.theme=red albanix.lang=sq quiet splash

LABEL albanix-en
    MENU LABEL Albanix OS (Red) — English language
    LINUX /boot/vmlinuz-albanix
    INITRD /boot/initramfs-albanix.img
    APPEND archisobasedir=albanix archisodevice=/dev/disk/by-label/ALBANIX_OS albanix.theme=red albanix.lang=en quiet splash

LABEL memtest
    MENU LABEL Memory Test
    COM32 /boot/memtest

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32