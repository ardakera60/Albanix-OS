# packages.conf — Calamares packages module
# Runs on the LIVE ISO.
# Installs the target system package list and removes live-only packages.

packages:
  # Package list comes from archiso packages.x86_64 (installed on target by
  # customize_airootfs / Calamares packages module).
  # Remove live-only packages after install:
  remove_on_exit:
    - calamares
    - calamares-python
  # The live user 'albanix' is removed; real user created in users module.
  enabled: true
