# initcpiocfg.conf — Calamares initcpio configuration module
# Runs on the LIVE ISO.
# Configures mkinitcpio hooks for the target (especially LUKS2 support).

initcpiocfg:
  # Default mkinitcpio.conf hooks; add encrypt if LUKS2 chosen.
  hooks: "base udev autodetect modconf kms keyboard keymap consolefont block encrypt filesystems fsck"
  modules: ""
  compression: "zstd"
