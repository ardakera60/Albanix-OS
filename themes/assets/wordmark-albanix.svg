    </linearGradient>
  </defs>
  <text x="20" y="90" font-family="Inter, sans-serif" font-size="64" font-weight="bold" fill="url(#wmRed)" letter-spacing="2">ALBANIX</text>
  <text x="340" y="90" font-family="Inter, sans-serif" font-size="32" fill="#0B0B0F" letter-spacing="1">OS</text>
