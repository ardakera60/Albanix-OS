# albanix-optional-groups.conf — Custom Calamares module: optional software groups
# Runs on the LIVE ISO.
# Lets the user pick Developer/Gaming/Creator/Office/Privacy groups.

albanix-optional-groups:
  groups:
    - id: developer
      name: "Developer"
      packages: "git nodejs pnpm python rustup docker podman code"
    - id: gaming
      name: "Gaming"
      packages: "steam proton-ge gamemode mangohud lutris"
    - id: creator
      name: "Creator"
      packages: "obs-studio kdenlive krita gimp inkscape blender"
    - id: office
      name: "Office"
      packages: "libreoffice okular"
    - id: privacy
      name: "Privacy"
      packages: "wireguard-tools torbrowser-launcher"
  storage_file: "/var/lib/calamares/albanix-groups"
  enabled: true
