# shellprocess.conf — Calamares shellprocess module (post-install)
# Runs inside the CHROOT (target system) at end of installation.
# Executes albanix-postinstall.sh with the target path as argument.

shellprocess:
  scripts:
    - script: /usr/share/calamares/scripts/albanix-postinstall.sh
      arguments: ["/target"]
  # Calamares passes the target mount point; we hardcode /target here because
  # albanix-installer-config installs this script and sets the run context.
  enabled: true
