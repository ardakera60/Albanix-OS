# keyboard.conf — Calamares keyboard module
# Runs on the LIVE ISO.
# Layouts: Albanian (al) + US (us), Alt+Shift switcher, AltGr/compose for ë/ç.

keyboard:
  # Layouts offered to the user.
  layouts:
    - layout: "al"
      variant: ""
    - layout: "us"
      variant: ""
  # Default layout follows the chosen language (al for sq, us for en).
  defaultLayout: "al"
