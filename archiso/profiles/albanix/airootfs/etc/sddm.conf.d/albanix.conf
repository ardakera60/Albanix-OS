[Autologin]
Relogin=false
Session=plasmawayland
User=albanix

[Theme]
# Current theme is chosen by albanix-theme-switcher at first boot from the
# kernel cmdline parameter albanix.theme=red|blue (default: red).
Current=

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Users]
MaximumUid=60000
MinimumUid=1000

[Wayland]
EnableHiDPI=true