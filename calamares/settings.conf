# Calamares settings.conf — Albanix OS
# Runs on the LIVE ISO (Calamares reads this at startup).
# Module sequence, branding, languages (sq + en), default sq_AL.
#
# Version: 3.4+
#

# --- branding -----------------------------------------------------------
branding:
  component: albanix
  # Path to branding desc: /usr/share/calamares/branding/albanix/branding.desc
  # or in the calamares package data dir.

# --- languages (restricted to Albanian + English) -----------------------
languages:
  en:
    shortname: "en"
    name: "English"
    kbdlayout: "us"
    timezone: "Europe/Tirane"
  sq:
    shortname: "sq"
    name: "Shqip"
    kbdlayout: "al"
    timezone: "Europe/Tirane"
default_language: sq

# --- welcome module ------------------------------------------------------
welcome:
  # show.qml slideshow is configured in branding/albanix/welcome/
  enabled: true

# --- module sequence (order matters) ------------------------------------
# Partitioning, users, summary etc. are instantiated here by Calamares.
# The custom theme-choice module and optional-groups module are provided
# by albanix-installer-config and installed into
# /usr/lib/calamares/modules/.
#
# Full module list is generated by Calamares from /usr/lib/calamares/modules/*.conf
# plus /etc/calamares/modules/*.conf (admin overrides). This settings.conf
# only declares global policy; individual module .conf files live in
# calamares/modules/ of this repo and are installed by albanix-installer-config.
#
# Sequence enforced by Calamares core:
#   welcome -> locale -> keyboard -> partition -> users -> summary -> ...
# Albanix inserts: theme-choice after summary, optional-groups before summary,
# finished (post-install shellprocess) last.

# --- python modules path -------------------------------------------------
pythonpath:
  - /usr/lib/calamares/python

# --- show.qml slideshow --------------------------------------------------
show:
  enabled: true

# --- debugging -----------------------------------------------------------
debug:
  enable: false
  # show console output when true
