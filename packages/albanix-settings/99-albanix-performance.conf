# =====================================================================
# Albanix OS performance sysctl tuning (CachyOS-inspired)
# One-line reason for every value. Applies at boot via systemd-sysctl.
# =====================================================================

# --- Memory management -------------------------------------------------

# vm.swappiness = 10
# Prefer keeping application memory in RAM; swap only under real pressure.
# Lower = less swapping, better desktop responsiveness on systems with RAM.
vm.swappiness = 10

# vm.vfs_cache_pressure = 200
# Reclaim page cache and inodes sooner under memory pressure so caches
# don't starve active applications. Default is 100; 200 is more aggressive.
vm.vfs_cache_pressure = 200

# Dirty page writeback thresholds (SSD-friendly, avoid write stalls).
# Start writeback at 10% of dirtyable memory, force at 30%.
vm.dirty_ratio = 30
vm.dirty_background_ratio = 10
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500

# Overcommit memory = 1 (always overcommit) — better for workloads that
# allocate large sparse regions (games, compilers, containers).
vm.overcommit_memory = 1

# --- Kernel / scheduler ------------------------------------------------

# Disable NMI watchdog to reduce latency spikes on laptops/desktops.
kernel.watchdog = 0

# Scheduler granularity tuned for interactivity (desktop/gaming).
# 10 ms min granularity, 2 ms wakeup granularity.
kernel.sched_min_granularity_ns = 10000000
kernel.sched_wakeup_granularity_ns = 2000000

# Transparent Huge Pages: "madvise" — only used when explicitly requested,
# avoiding THP-induced stalls on latency-sensitive workloads.
# (Set via kernel cmdline transparent_hugepage=madvise too.)
kernel.sched_autogroup_enabled = 1

# --- File watches (IDEs, node, rust tooling) --------------------------

fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
fs.file-max = 2097152

# --- Networking (TCP BBR + fq) -----------------------------------------

# fq default qdisc + BBR congestion control: better throughput and lower
# latency on WAN/Internet connections vs the default cubic/pfifo_fast.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Increase socket buffers for high-bandwidth links.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
